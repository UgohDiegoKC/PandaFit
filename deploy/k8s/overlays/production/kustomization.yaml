apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pandafit-production
resources:
  - ../../base
configMapGenerator:
  - name: pandafit-config
    literals:
      - APP_URL=https://pandafit.example.com
      - AI_MODEL=claude-sonnet-5-5
      - AI_TIMEOUT_MS=25000
      - EMAIL_PROVIDER=console
      - EMAIL_FROM=PandaFit <no-reply@pandafit.example.com>
      - VAPID_SUBJECT=mailto:support@pandafit.example.com
replicas:
  - name: pandafit
    count: 3
patches:
  - target: { kind: Ingress, name: pandafit }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: pandafit.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: pandafit.example.com
images:
  - name: pandafit
    newName: ghcr.io/OWNER/pandafit
    newTag: latest
