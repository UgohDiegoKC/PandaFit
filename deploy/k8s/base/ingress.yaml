apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pandafit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [pandafit.example.com]
      secretName: pandafit-tls
  rules:
    - host: pandafit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: pandafit, port: { name: http } } }
