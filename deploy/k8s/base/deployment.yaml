apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandafit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {}
  template:
    metadata:
      labels: {}
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: pandafit
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: pandafit-config }
            # Secret holds AUTH_SECRET, DATABASE_URL, DATABASE_AUTH_TOKEN, ANTHROPIC_API_KEY,
            # CRON_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, and RESEND_API_KEY or SENDGRID_API_KEY.
            # Manage with External Secrets / Sealed Secrets — never commit real values.
            - secretRef: { name: pandafit-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: {}
