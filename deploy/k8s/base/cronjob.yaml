# Runs the reminder job every 5 minutes by calling the app's protected endpoint.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pandafit-reminders
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              env:
                - name: CRON_SECRET
                  valueFrom: { secretKeyRef: { name: pandafit-secrets, key: CRON_SECRET } }
              command: ["sh", "-c", 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" http://pandafit/api/cron/reminders']
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
