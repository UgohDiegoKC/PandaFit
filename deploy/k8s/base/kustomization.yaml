apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml
labels:
  - pairs: { app.kubernetes.io/name: pandafit }
    includeSelectors: true
images:
  - name: pandafit
    newName: ghcr.io/OWNER/pandafit
    newTag: latest
