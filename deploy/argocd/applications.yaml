# Apply once to the ArgoCD namespace: kubectl apply -n argocd -f deploy/argocd/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pandafit-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/pandafit.git
    targetRevision: main
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: pandafit-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pandafit-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/pandafit.git
    targetRevision: main
    path: deploy/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: pandafit-production
  # Manual sync in production: review the diff in ArgoCD, then Sync. Roll back with "History and rollback".
  syncPolicy:
    syncOptions: [CreateNamespace=true]
