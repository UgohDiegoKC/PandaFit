# Build → push image to GHCR → bump the image tag in the GitOps overlay.
# ArgoCD watches deploy/k8s/overlays/* and rolls the change out.
#   main          → staging (automatic)
#   tag v*.*.*    → production (automatic sync is OFF in prod; promote in ArgoCD)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pandafit

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump image tag in overlay
        run: |
          ENV=$([[ "$GITHUB_REF" == refs/tags/* ]] && echo production || echo staging)
          cd deploy/k8s/overlays/$ENV
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image pandafit=${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
          rm kustomize
          git config user.name "pandafit-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "deploy($ENV): pandafit ${{ needs.image.outputs.tag }}" && git push || echo "No change"
